<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - SkillWithJigs</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --p: #7c6fff;
            --p2: #a78bfa;
            --bg: #08080f;
            --t1: #ffffff;
            --t2: #9090b0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--t1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
        }

        .success-icon {
            font-size: 80px;
            color: #10b981;
            margin-bottom: 24px;
            animation: successBounce 0.8s ease;
        }

        @keyframes successBounce {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .success-title {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 16px;
        }

        .success-text {
            font-size: 16px;
            color: var(--t2);
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .success-info {
            background: rgba(16,185,129,0.1);
            border: 1.5px solid rgba(16,185,129,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item i {
            font-size: 18px;
            color: #10b981;
        }

        .success-buttons {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--p), var(--p2));
            color: #fff;
            box-shadow: 0 6px 20px rgba(124,111,255,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(124,111,255,0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--t2);
            border: 1.5px solid rgba(124,111,255,0.3);
        }

        .btn-secondary:hover {
            color: #fff;
            border-color: var(--p);
            background: rgba(124,111,255,0.1);
        }

        .countdown {
            font-size: 12px;
            color: var(--t2);
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="ph-fill ph-check-circle"></i>
        </div>

        <h1 class="success-title">Welcome to SkillWithJigs!</h1>
        <p class="success-text">Your account has been created successfully. You're one step away from joining our learning community!</p>

        <div class="success-info">
            <div class="info-item">
                <i class="ph ph-check"></i>
                <span>Account registered and verified</span>
            </div>
            <div class="info-item">
                <i class="ph ph-check"></i>
                <span>Ready to start teaching and learning</span>
            </div>
            <div class="info-item">
                <i class="ph ph-check"></i>
                <span>Access to 500+ skills</span>
            </div>
        </div>

        <div class="success-buttons">
            <a href="dashboard.html" class="btn btn-primary">
                <i class="ph ph-speedometer"></i> Go to Dashboard
            </a>
            <a href="index.html" class="btn btn-secondary">
                <i class="ph ph-home"></i> Back to Home
            </a>
        </div>

        <p class="countdown">Redirecting to dashboard in <span id="countdown">5</span> seconds...</p>
    </div>

    <script>
        let count = 5;
        const countdownEl = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            
            if (count === 0) {
                clearInterval(interval);
                window.location.href = 'dashboard.html';
            }
        }, 1000);
    </script>
</body>
</html>
