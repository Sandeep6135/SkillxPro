<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - SkillWithJigs</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="login.css">
    <style>
        .verify-container {
            text-align: center;
            padding: 40px 20px;
        }
        .verify-icon {
            font-size: 64px;
            color: var(--p);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .verify-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 12px;
        }
        .verify-text {
            color: var(--t2);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .verify-code {
            background: rgba(124,111,255,0.1);
            border: 2px solid rgba(124,111,255,0.25);
            border-radius: 12px;
            padding: 20px;
            margin: 24px 0;
            font-size: 32px;
            font-weight: 700;
            color: var(--p);
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
        }
        .verify-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 24px 0;
        }
        .verify-input {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(124,111,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }
        .verify-input:focus {
            outline: none;
            border-color: var(--p);
            background: rgba(124,111,255,0.15);
        }
        .verify-button {
            padding: 14px 48px;
            background: linear-gradient(135deg, var(--p), var(--p2));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }
        .verify-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124,111,255,0.4);
        }
        .resend-text {
            color: var(--t3);
            font-size: 14px;
            margin-top: 20px;
        }
        .resend-link {
            color: var(--p);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .resend-link:hover {
            color: var(--p2);
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    
    <div class="page-center" style="padding-top: 0;">
        <div class="glass-card">
            <div class="verify-container">
                <div class="verify-icon">
                    <i class="ph ph-envelope-open"></i>
                </div>
                
                <h1 class="verify-title">Verify Your Email</h1>
                <p class="verify-text">We've sent a 6-digit code to your email address. Enter it below to verify your account.</p>
                
                <div class="verify-inputs" id="verify-inputs">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                    <input type="number" class="verify-input" min="0" max="9" maxlength="1" inputmode="numeric">
                </div>
                
                <button class="verify-button" id="verify-btn" onclick="verifyEmail()">
                    <i class="ph ph-check-circle"></i> Verify Email
                </button>
                
                <p class="resend-text">
                    Didn't receive the code? 
                    <a href="#" class="resend-link" onclick="resendCode(event)">Resend Code</a>
                </p>
            </div>
        </div>
    </div>

    <script src="verify-email.js"></script>
</body>
</html>
